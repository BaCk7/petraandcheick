<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Petra & Cheick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Karla:wght@400;500;600&display=swap">
<style>
/* Single light theme by design: sunset over the cypresses. */
:root{
  --mist:#F3ECE2; --paper:#FBF8F3; --ink:#2A3B34; --muted:#5F6A62; --dim:#8E948A;
  --gold:#E4A55A; --gold-ink:#9A5B1D; --line:rgba(42,59,52,.16);
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Karla',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:1.0625rem;font-weight:500;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
figure{margin:0}
.gutter{padding-inline:clamp(16px,5vw,48px)}

.top{position:absolute;inset:0 0 auto 0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding-block:1.25rem;padding-inline:clamp(16px,5vw,48px)}
.mono{font-family:var(--body);font-size:.75rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.langs{display:flex;gap:.25rem}
.langs button{appearance:none;border:1px solid var(--line);background:rgba(251,248,243,.6);color:var(--ink);padding:.4rem .65rem;border-radius:999px;cursor:pointer;font-family:var(--body);font-size:.75rem;letter-spacing:.14em;backdrop-filter:blur(6px)}
.langs button{display:inline-flex;align-items:center;gap:.4rem}
.langs .flag{width:18px;height:12px;border-radius:2px;box-shadow:0 0 0 1px rgba(42,59,52,.15)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.langs button:focus-visible,.btn:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}

.eyebrow{margin:0;font-family:var(--body);font-size:1.0625rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-ink)}
h1{margin:0;font-family:var(--display);font-weight:600;font-style:italic;font-size:clamp(3.25rem,10vw,6.5rem);line-height:1;letter-spacing:-.01em;text-wrap:balance}
h1 .amp{font-style:italic;font-weight:500;color:var(--gold-ink);padding-inline:.12em}
.date{margin:.75rem 0 0;font-family:var(--display);font-weight:600;font-style:italic;font-size:clamp(2.25rem,6vw,3.5rem);line-height:1;letter-spacing:.02em;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.date sup{font-size:.42em;vertical-align:baseline;position:relative;top:-.9em;letter-spacing:0;margin-right:.08em}
.place{margin:.25rem 0 0;font-size:1rem;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.long{margin:0;font-family:var(--display);font-size:1.25rem;font-weight:500;color:var(--muted);font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}

main{max-width:40rem;margin:0 auto;padding-block:3.5rem 4rem;display:grid;gap:3.5rem}
section{display:grid;gap:1rem}
h2{margin:0;font-family:var(--display);font-weight:500;font-size:1.75rem;line-height:1.1;letter-spacing:-.005em;text-wrap:balance;text-align:center}
main section>.label{font-size:1.125rem;letter-spacing:.32em;text-align:center;display:flex;align-items:center;gap:1.25rem;justify-content:center;white-space:nowrap}
main section>.label::before,main section>.label::after{content:"";flex:0 0 72px;height:46px;background:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%2064%22%20fill%3D%22none%22%20stroke%3D%22%235F7A58%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M16%2062%20L16%2030%22/%3E%3Cg%20transform%3D%22translate%2816.0%2030.0%29%20rotate%280%29%20scale%280.27%200.27%29%20translate%28-50%20-90%29%22%20stroke%3D%22none%22%3E%3Cpath%20d%3D%22M50%2090%20C22%2090%2010%2060%2016%2040%20C18%2032%2024%2024%2030%2018%20C40%2023%2046%2024%2050%2029%20C54%2024%2060%2023%2072%2018%20C82%2032%2088%2050%2082%2068%20C78%2080%2070%2088%2050%2090%20Z%22%20fill%3D%22%23D8A45C%22/%3E%3Cpath%20d%3D%22M44%2025%20L50%2017%20L56%2023%22%20fill%3D%22none%22%20stroke%3D%22%23D8A45C%22%20stroke-width%3D%226%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M50%2029%20C60%2038%2066%2046%2068%2052%20C72%2064%2066%2084%2052%2089%22%20fill%3D%22none%22%20stroke%3D%22%23BE8A42%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2816%2060%29%20scale%280.36%29%22%3E%3Cpath%20d%3D%22M0%200%20C-20%200%20-34%20-14%20-38%20-38%20C-16%20-36%20-4%20-22%200%200%20Z%22%20fill%3D%22rgba%2895%2C122%2C88%2C.2%29%22%20stroke-width%3D%224.44%22/%3E%3Cpath%20d%3D%22M0%200%20C-20%200%20-34%20-14%20-38%20-38%20C-16%20-36%20-4%20-22%200%200%20Z%22%20transform%3D%22scale%28-1%201%29%22%20fill%3D%22rgba%2895%2C122%2C88%2C.2%29%22%20stroke-width%3D%224.44%22/%3E%3C/g%3E%3Cpath%20d%3D%22M50%2062%20L50%2024%22/%3E%3Cg%20transform%3D%22translate%2850.0%2024.0%29%20rotate%280%29%20scale%280.31%200.31%29%20translate%28-50%20-90%29%22%20stroke%3D%22none%22%3E%3Cpath%20d%3D%22M50%2090%20C22%2090%2010%2060%2016%2040%20C18%2032%2024%2024%2030%2018%20C40%2023%2046%2024%2050%2029%20C54%2024%2060%2023%2072%2018%20C82%2032%2088%2050%2082%2068%20C78%2080%2070%2088%2050%2090%20Z%22%20fill%3D%22%23D8A45C%22/%3E%3Cpath%20d%3D%22M44%2025%20L50%2017%20L56%2023%22%20fill%3D%22none%22%20stroke%3D%22%23D8A45C%22%20stroke-width%3D%226%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M50%2029%20C60%2038%2066%2046%2068%2052%20C72%2064%2066%2084%2052%2089%22%20fill%3D%22none%22%20stroke%3D%22%23BE8A42%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2850%2060%29%20scale%280.36%29%22%3E%3Cpath%20d%3D%22M0%200%20C-20%200%20-34%20-14%20-38%20-38%20C-16%20-36%20-4%20-22%200%200%20Z%22%20fill%3D%22rgba%2895%2C122%2C88%2C.2%29%22%20stroke-width%3D%224.44%22/%3E%3Cpath%20d%3D%22M0%200%20C-20%200%20-34%20-14%20-38%20-38%20C-16%20-36%20-4%20-22%200%200%20Z%22%20transform%3D%22scale%28-1%201%29%22%20fill%3D%22rgba%2895%2C122%2C88%2C.2%29%22%20stroke-width%3D%224.44%22/%3E%3C/g%3E%3Cpath%20d%3D%22M84%2062%20L84%2032%22/%3E%3Cg%20transform%3D%22translate%2884.0%2032.0%29%20rotate%280%29%20scale%280.25%200.25%29%20translate%28-50%20-90%29%22%20stroke%3D%22none%22%3E%3Cpath%20d%3D%22M50%2090%20C22%2090%2010%2060%2016%2040%20C18%2032%2024%2024%2030%2018%20C40%2023%2046%2024%2050%2029%20C54%2024%2060%2023%2072%2018%20C82%2032%2088%2050%2082%2068%20C78%2080%2070%2088%2050%2090%20Z%22%20fill%3D%22%23D8A45C%22/%3E%3Cpath%20d%3D%22M44%2025%20L50%2017%20L56%2023%22%20fill%3D%22none%22%20stroke%3D%22%23D8A45C%22%20stroke-width%3D%226%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M50%2029%20C60%2038%2066%2046%2068%2052%20C72%2064%2066%2084%2052%2089%22%20fill%3D%22none%22%20stroke%3D%22%23BE8A42%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2884%2060%29%20scale%280.36%29%22%3E%3Cpath%20d%3D%22M0%200%20C-20%200%20-34%20-14%20-38%20-38%20C-16%20-36%20-4%20-22%200%200%20Z%22%20fill%3D%22rgba%2895%2C122%2C88%2C.2%29%22%20stroke-width%3D%224.44%22/%3E%3Cpath%20d%3D%22M0%200%20C-20%200%20-34%20-14%20-38%20-38%20C-16%20-36%20-4%20-22%200%200%20Z%22%20transform%3D%22scale%28-1%201%29%22%20fill%3D%22rgba%2895%2C122%2C88%2C.2%29%22%20stroke-width%3D%224.44%22/%3E%3C/g%3E%3C/svg%3E') no-repeat center/contain}
main section>.label::after{transform:scaleX(-1)}
main section>.lead{text-align:center;justify-self:center}
.label{margin:0;font-size:.8125rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-ink)}
.intro{margin:0;font-family:var(--display);font-size:1.5rem;line-height:1.35;font-weight:500;text-align:center;max-width:32ch;justify-self:center;text-wrap:balance}
.rule{width:3rem;height:1px;background:var(--gold-ink);justify-self:center;opacity:.7}
.soon{margin:0;font-weight:500;text-align:center;color:var(--muted);max-width:40ch;justify-self:center}
.photo{display:block;width:100%;height:100%;object-fit:cover}
figcaption{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:.75rem;text-align:center}

.stops{list-style:none;margin:.5rem 0 0;padding:0;display:grid}
.stop{display:grid;grid-template-columns:1.25rem minmax(0,1fr);gap:0 1rem;position:relative;padding-bottom:1.75rem}
.stop:last-child{padding-bottom:0}
.stop .dot{width:.7rem;height:.7rem;border-radius:50%;border:1.5px solid var(--gold-ink);background:var(--mist);margin-top:.45rem;justify-self:center;position:relative;z-index:1}
.stop.end .dot{background:var(--gold-ink)}
.stop::before{content:"";position:absolute;left:calc(.625rem - .5px);top:1rem;bottom:0;width:1px;background:var(--line)}
.stop:last-child::before{display:none}
.stop .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .6rem}
.stop .code{font-family:var(--display);font-size:1.5rem;font-weight:500;letter-spacing:.04em}
.stop .arrow{color:var(--gold-ink)}
.stop .alt{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stop p{margin:.15rem 0 0;color:var(--muted);max-width:52ch}
.links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.5rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;font-size:.8125rem;letter-spacing:.12em;text-transform:uppercase;padding:.7rem 1.1rem;border:1px solid var(--ink);border-radius:999px;color:var(--ink);transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.primary:hover{background:var(--gold-ink);border-color:var(--gold-ink);color:var(--paper)}
.btn svg{width:1em;height:1em}
.card{border:1px solid var(--line);background:var(--paper);padding:1.5rem;display:grid;gap:1rem}
.card .name{margin:0;font-family:var(--display);font-size:1.75rem;font-weight:400}
.facts{display:flex;flex-wrap:wrap;gap:1rem 2.5rem;margin:0;padding:0}
.facts div{display:grid;gap:.15rem}
.facts dt{font-size:.6875rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0}
.facts dd{margin:0;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.card p{margin:0;color:var(--muted)}

/* Details: venue, travel options, stay cards */
.lead{margin:0;color:var(--muted);max-width:60ch}
.sub{margin:1rem 0 0;font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-ink)}
.addr{margin:0;color:var(--muted);text-align:center}
.card{text-align:center}
.card .facts,.card .links{justify-content:center}
.opt .stops{text-align:left;max-width:62ch;margin-inline:auto;width:100%}
.opt .note{text-align:center;max-width:62ch;margin-inline:auto}
main section>.lead,main section>.sub{text-align:center;justify-self:center}
.map{width:100%;height:14rem;overflow:hidden;background:var(--mist)}
.map iframe{display:block;width:100%;height:100%;border:0}
.two{display:grid;gap:1.25rem}
.opt h3,.stay h3{margin:0;font-family:var(--display);font-weight:500;font-size:1.5rem;line-height:1.15}
.opt .kicker{margin:0;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink)}
.opt .stops{margin-top:0}
.opt .stop{padding-bottom:1rem}
.opt .stop p{font-size:1rem}
.note{margin:0;font-size:.9375rem;color:var(--dim);font-style:italic}
.either{margin:.1rem 0 .5rem;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink)}
.branches{display:grid;gap:.75rem}
.branch{position:relative;border-left:2px solid var(--gold);padding-left:.85rem}
.branch p{margin:0}
.orw{display:block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:.2rem}
@media (min-width:641px){.branches{grid-template-columns:1fr 1fr;gap:1.25rem}}
.opt a,.lead a{color:var(--gold-ink);text-decoration-thickness:1px;text-underline-offset:3px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
.strip img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.strip.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.strip.n1{grid-template-columns:1fr}
.strip.n1 img{aspect-ratio:3/2}
.slides{display:block;position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--mist)}
.slides img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:cover;opacity:0;transition:opacity .8s ease}
.slides img.on{opacity:1}
.dots{position:absolute;left:0;right:0;bottom:.6rem;display:flex;justify-content:center;gap:.4rem;z-index:1}
.dots button{appearance:none;border:0;width:.5rem;height:.5rem;border-radius:999px;background:rgba(251,248,243,.55);padding:0;cursor:pointer}
.dots button.on{background:var(--paper);width:1.25rem}
.sl-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:1;appearance:none;border:0;width:2.5rem;height:2.5rem;border-radius:999px;background:rgba(42,59,52,.45);color:#fff;font-size:1.5rem;line-height:1;display:grid;place-items:center;cursor:pointer;opacity:.85}
.sl-nav:hover{background:rgba(42,59,52,.7)}
.sl-prev{left:.6rem}.sl-next{right:.6rem}
@media (prefers-reduced-motion:reduce){.slides img{transition:none}}
.strip.n2 img{aspect-ratio:3/2}
.venue-strip{grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.venue-strip img{aspect-ratio:3/2}
.strip img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(20,30,27,.9);display:grid;place-items:center;padding:1rem;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox button{position:absolute;appearance:none;border:0;background:rgba(251,248,243,.15);color:#fff;width:2.75rem;height:2.75rem;border-radius:999px;font-size:1.5rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.lightbox button:hover{background:rgba(251,248,243,.3)}
.lb-close{top:calc(env(safe-area-inset-top,0px) + .75rem);right:.75rem}
.lb-nav{top:50%;transform:translateY(-50%)}
.lb-prev{left:.75rem}.lb-next{right:.75rem}
.lb-count{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);left:50%;transform:translateX(-50%);color:rgba(255,255,255,.8);font-size:.8125rem;letter-spacing:.14em}
.lightbox img{user-select:none;-webkit-user-drag:none;touch-action:pan-y}
@media (max-width:640px){
  h2{font-size:1.5rem}
  main section>.label{font-size:.9375rem;gap:.75rem;letter-spacing:.24em}
  main section>.label::before,main section>.label::after{flex:0 0 50px;height:32px}
  .venue-strip{grid-template-columns:1fr 1fr}
  .venue-strip img:first-child{grid-column:1/-1;aspect-ratio:16/10}
  .strip.n2{grid-template-columns:1fr}
}
.stay .facts dd{font-size:1.25rem}

footer{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;text-align:center;padding-block:2rem 3rem;display:grid;gap:.35rem;color:var(--dim);font-size:.8125rem;letter-spacing:.1em}
footer .n{font-family:var(--display);font-size:1.5rem;font-style:italic;color:var(--ink);letter-spacing:0}
@media (max-width:480px){ .card{padding:1.25rem} }

/* Hero. Phones: the ring photo fills the screen with the text on the sky.
   Wider screens: text centred on the left, the whole ring photo on the right. */
.hero{position:relative;height:100vh;height:100svh;min-height:34rem;display:grid;align-content:start;justify-items:center;text-align:center;overflow:hidden;isolation:isolate}
.hero .pic{position:absolute;inset:0;margin:0;z-index:-2}
.hero .bg{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(243,236,226,.9) 0%,rgba(243,236,226,.6) 24%,rgba(243,236,226,0) 46%)}
.hero .place{color:var(--ink)}
.hero .inner{padding-block:5.5rem 0;display:grid;gap:.5rem;justify-items:center;text-shadow:0 0 28px rgba(243,236,226,.95),0 0 10px rgba(243,236,226,.8)}
main.wide{max-width:58rem}
.pair{display:grid;gap:2rem}
.pair .text{display:grid;gap:1rem;justify-items:center;text-align:center}
/* Phones: ring hero with the names, info, beach photo, signature.
   Wide: beach hero with the names, ring photo beside the info, signature. */
.pair .ring{display:none}
main .beach{aspect-ratio:4/3;overflow:hidden}
@media (min-width:641px){
  .hero{align-content:center;justify-items:end;text-align:right}
  .hero::before{background:radial-gradient(ellipse 26% 30% at 84% 47%,rgba(243,236,226,.6) 0%,rgba(243,236,226,.3) 55%,rgba(243,236,226,0) 100%)}
  .hero .inner{padding:0 clamp(2rem,6vw,6rem) 6vh 0;max-width:40rem;justify-items:end}
  .hero h1{font-size:clamp(3.25rem,7vw,6rem)}
  .hero .bg{filter:brightness(1.2) saturate(1.08)}
  .top .mono{display:none}
  .top{justify-content:flex-end}
  main .beach{display:none}
  .pair{grid-template-columns:1fr;gap:2rem}
  .pair .ring{display:block;aspect-ratio:16/10;overflow:hidden;order:1;width:100%;max-width:44rem;margin-inline:auto}
  .pair .text{justify-items:center;text-align:center}
  .two{grid-template-columns:1fr 1fr;align-items:start}
  #options{grid-template-columns:1fr}
  #stays,#stays2{grid-template-columns:1fr}
  #stays .strip{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media (max-width:380px){main section>.label{letter-spacing:.16em;gap:.5rem}}
</style>

<script>
// Texts and settings live in content/site.js
const CONFIG=window.SITE.config, T=window.SITE.text;

const $=s=>document.querySelector(s);
const d=CONFIG.date;
$('#names').innerHTML=`${CONFIG.names[0]}<span class="amp">&amp;</span>${CONFIG.names[1]}`;
$('#topNames').textContent=`${CONFIG.names[0]} & ${CONFIG.names[1]}`;
$('#fNames').textContent=`${CONFIG.names[0]} & ${CONFIG.names[1]}`;
$('#fDate').textContent=`${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;
$('#mapVenue').href=CONFIG.maps.venue;
$('#stationLink').href=CONFIG.maps.station; $('#stationLink2').href=CONFIG.maps.station;

const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function optCard(o,t){
  const step=(st,i)=>{
    const last=i===o.steps.length-1;
    if(st&&st.or) return `<li class="stop fork${last?' end':''}"><span class="dot"></span><div><p class="either">${esc(t.orLabel)}</p><div class="branches">${st.or.map((b,k)=>`<div class="branch">${k>0?`<span class="orw">${esc(t.orWord)}</span>`:''}<p>${b}</p></div>`).join('')}</div></div></li>`;
    return `<li class="stop${last?' end':''}"><span class="dot"></span><div><p>${st}</p></div></li>`;
  };
  return `<article class="card opt"><p class="kicker">${esc(o.kicker)}</p><h3>${esc(o.title)}</h3>
    <ol class="stops">${o.steps.map(step).join('')}</ol>
    ${o.note?`<p class="note">${o.note}</p>`:''}</article>`;
}
function stayCard(c,photos,n){
  const strip=`<div class="strip slides">${photos.map((src,k)=>`<img src="${src}" alt="" loading="lazy"${k===0?' class="on"':''}>`).join('')}<button type="button" class="sl-nav sl-prev" aria-label="Previous">‹</button><button type="button" class="sl-nav sl-next" aria-label="Next">›</button><div class="dots">${photos.map((_,k)=>`<button type="button" data-k="${k}"${k===0?' class="on"':''} aria-label="${k+1}"></button>`).join('')}</div></div>`;
  const facts=`<dl class="facts">${c.facts.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
  const links=c.map?`<div class="links"><a class="btn" href="${c.map}" target="_blank" rel="noopener">${c.mapBtn}</a></div>`:c.book?`<div class="links"><a class="btn" href="${c.book}" target="_blank" rel="noopener">${c.bookBtn}</a></div>`:'';
  return `<article class="card stay"><h3>${esc(c.title)}</h3>${strip}${facts}<p>${esc(c.text)}</p>${c.cta?`<p><strong>${esc(c.cta)}</strong></p>`:''}${links}</article>`;
}

function setLang(l){
  const t=T[l]||T.en; l=T[l]?l:'en';
  document.documentElement.lang=l;
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=t[el.dataset.t]||''; });
  $('#dateShort').innerHTML=t.dateHero;
  const dl=new Intl.DateTimeFormat(t.locale,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
  $('#dateLong').textContent=dl.charAt(0).toUpperCase()+dl.slice(1);
  const abroad=l!=='sk';
  document.querySelectorAll('.abroad').forEach(s=>{ s.hidden=!abroad; });
  document.querySelectorAll('.local').forEach(s=>{ s.hidden=abroad; });
  if(abroad) $('#options').innerHTML=optCard(t.opt1,t)+optCard(t.opt2,t)+(t.opt3?optCard(t.opt3,t):'');
  $('#localTravel').innerHTML=t.localTravel||'';
  $('#stayAltText').innerHTML=t.stayAltText||'';
  $('#stayMore').innerHTML=t.stayMore||'';
  const others=stayCard(Object.assign({book:CONFIG.booking.penzion,bookBtn:t.bookBtn},t.pension),CONFIG.photos.penzion,2);
  if(t.chata){ $('#stays').innerHTML=stayCard(Object.assign({map:CONFIG.maps.kovalinka,mapBtn:t.mapBtn},t.chata),CONFIG.photos.chata,3); $('#stays2').innerHTML=others; }
  else { $('#stays').innerHTML=others; $('#stays2').innerHTML=''; }
  document.querySelectorAll('#langs button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.lang===l)));
  try{localStorage.setItem('wedding-lang',l)}catch(e){}
}
document.querySelectorAll('#langs button').forEach(x=>x.addEventListener('click',()=>setLang(x.dataset.lang)));
let initial=(location.hash||'').replace('#','').toLowerCase();
if(!T[initial]){ try{ initial=localStorage.getItem('wedding-lang')||''; }catch(e){} }
if(!T[initial]){ const nav=(navigator.languages||[navigator.language||'en']).map(x=>x.slice(0,2).toLowerCase()); initial=nav.find(x=>T[x])||'en'; }
setLang(initial);
addEventListener('hashchange',()=>{ const h=location.hash.replace('#','').toLowerCase(); if(T[h]) setLang(h); });

// ---- Lightbox for the photo strips ----
(function(){
  const lb=$('#lightbox'), im=$('#lbImg'), count=$('#lbCount');
  let list=[], i=0;
  function show(n){ i=(n+list.length)%list.length; im.src=list[i]; count.textContent=list.length>1?`${i+1} / ${list.length}`:''; }
  function open(strip,img){ list=[...strip.querySelectorAll('img')].map(x=>x.currentSrc||x.src); show(list.indexOf(img.currentSrc||img.src)); lb.hidden=false; document.body.style.overflow='hidden'; }
  function close(){ lb.hidden=true; im.src=''; document.body.style.overflow=''; }
  document.addEventListener('click',e=>{ if(e.target.closest('.dots')||e.target.closest('.sl-nav')) return; const st=e.target.closest('.strip'); if(!st) return; const t=e.target.closest('img')||st.querySelector('img.on')||st.querySelector('img'); open(st,t); });
  lb.addEventListener('click',e=>{ if(e.target===lb||e.target===im||e.target.id==='lbClose') close(); });
  $('#lbPrev').addEventListener('click',()=>show(i-1)); $('#lbNext').addEventListener('click',()=>show(i+1));
  addEventListener('keydown',e=>{ if(lb.hidden) return; if(e.key==='Escape') close(); if(e.key==='ArrowLeft') show(i-1); if(e.key==='ArrowRight') show(i+1); });
  let x0=null;
  lb.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true});
  lb.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>40) show(dx<0?i+1:i-1); });
})();

// ---- Slideshows: auto-advance, pause on hover, dots ----
(function(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setup(sl){
    const imgs=[...sl.querySelectorAll('img')], dots=[...sl.querySelectorAll('.dots button')]; let i=0, timer=null;
    function go(n){ i=(n+imgs.length)%imgs.length; imgs.forEach((im,k)=>im.classList.toggle('on',k===i)); dots.forEach((d,k)=>d.classList.toggle('on',k===i)); }
    function start(){ if(reduce||imgs.length<2) return; stop(); timer=setInterval(()=>go(i+1),6000); }
    function stop(){ if(timer) clearInterval(timer); timer=null; }
    dots.forEach(d=>d.addEventListener('click',e=>{ e.stopPropagation(); go(+d.dataset.k); start(); }));
    const pv=sl.querySelector('.sl-prev'), nx=sl.querySelector('.sl-next');
    if(pv) pv.addEventListener('click',e=>{ e.stopPropagation(); go(i-1); start(); });
    if(nx) nx.addEventListener('click',e=>{ e.stopPropagation(); go(i+1); start(); });
    sl.addEventListener('mouseenter',stop); sl.addEventListener('mouseleave',start);
    start();
  }
  const seen=new WeakSet();
  function scan(){ document.querySelectorAll('.slides').forEach(sl=>{ if(!seen.has(sl)){ seen.add(sl); setup(sl); } }); }
  scan(); new MutationObserver(scan).observe(document.querySelector('main'),{childList:true,subtree:true});
})();

// ---- Hero crop: keep the ring in frame, show as much sunset as the box allows ----
(function(){
  const hero=$('.hero'), box=hero.querySelector('.pic'), img=box.querySelector('.bg');
  const RING=0.89;           // bottom of the ring, as a fraction of the photo height
  const AR=1350/1800;        // photo width / height
  const wide=matchMedia('(min-width:641px)');
  function fit(){
    // wide: the beach photo behind the names. phones: the vertical ring photo, cropped to keep the ring
    const w=box.clientWidth, h=box.clientHeight;
    const f=h/(w/AR);        // fraction of the photo height visible when width-fitted
    let y=50;
    if(f<1){ const t=Math.max(0,RING-f); y=Math.min(100,100*t/(1-f)); }
    img.style.objectPosition=`50% ${y.toFixed(1)}%`;
  }
  fit(); addEventListener('resize',fit);
})();
</script>
